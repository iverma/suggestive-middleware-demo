name: Agent compare

# Live rules-vs-agent comparison, both arms side by side (Claude Haiku 4.5 on Bedrock for the
# agent's reroutes). Not free: about 50 cents of model calls per 500-record agent arm. By hand only.
on:
  workflow_dispatch:
    inputs:
      records: { description: "Records per arm", default: "500" }

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

env:
  DEMO_URL: https://htd5qtuasvlslvzldh3bsragui0jdkwr.lambda-url.us-west-2.on.aws/

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Agent and rules arms side by side, same customers
        run: python3 scripts/agent_compare.py "$DEMO_URL" "${{ inputs.records || '500' }}"
