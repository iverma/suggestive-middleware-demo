name: Deploy

# Tests, then deploys the CDK app in infra/ whenever infra or the golden set changes on main.
# Can also be run by hand: Actions tab -> "Deploy" -> Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "golden_set/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# never run two deploys against the same account at once
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests (alarm wiring on the synthesized stack; mocked end to end with crashes and races)
        run: |
          pip install -q boto3 "moto[dynamodb,sqs]" pytest -r infra/requirements.txt
          set +e
          python -m pytest infra/tests -q -p no:warnings -rf 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # Surface failures as annotations, readable without downloading the log.
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | sed 's/^/::error title=Test failed::/'
          grep -E "^E  " pytest.log | head -8 | sed 's/^/::error title=Assertion::/'
          tail -1 pytest.log | sed 's/^/::notice title=Tests::/'
          exit $status

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CDK
        run: |
          pip install -q -r requirements.txt
          npm install -g aws-cdk@2 >/dev/null

      - name: Sign in with the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Diff
        run: cdk diff --fail=false

      - name: Deploy
        run: cdk deploy --all --require-approval never --outputs-file outputs.json

      - name: Report outputs
        run: |
          cat outputs.json
          python3 -c "
          import json
          o = json.load(open('outputs.json'))['effect-demo-customer-records']
          print(f\"::notice title=Demo UI::{o['DemoUrl']}\")
          print(f\"::notice title=Deployed::{o['TableName']} loaded with {o['RecordsLoaded']} records\")
          print(f\"::notice title=Paced load::{o['LoadWcuConsumed']} WCU in {o['LoadSeconds']}s = {o['LoadWcuPerSecActual']} WCU/s via {o['ExperimentControlFunction']}\")
          print(f\"::notice title=Experiment control ARN::{o['ExperimentControlArn']}\")
          "

      - name: Smoke test the public URL
        run: |
          URL=$(python3 -c "import json;print(json.load(open('outputs.json'))['effect-demo-customer-records']['DemoUrl'])")
          curl -fsS "${URL}" | grep -q "re-booking desk" || { echo "::error::UI did not load"; exit 1; }
          CODE=$(curl -sS -o results.json -w "%{http_code}" "${URL}results")
          if [ "$CODE" != "200" ]; then echo "::error title=Smoke test::/results returned ${CODE}: $(head -c 400 results.json)"; exit 1; fi
          python3 -c "import json; r=json.load(open('results.json')); print(f\"::notice title=Smoke test::UI up; /results sees {r['records_in_table']} records\")"
