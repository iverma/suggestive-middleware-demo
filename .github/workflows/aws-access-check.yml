name: AWS access check

# Run by hand: Actions tab -> "AWS access check" -> Run workflow (branch: main).
# Proves both roles work through GitHub OIDC, and that each can do only what it should.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Report what GitHub will send to AWS (shown as notices in the run summary)
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          LOGS_ROLE: ${{ vars.AWS_LOGS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "::notice title=AWS_ROLE_ARN::${ROLE:-<not set>}"
          echo "::notice title=AWS_LOGS_ROLE_ARN::${LOGS_ROLE:-<not set>}"
          echo "::notice title=AWS_REGION::${REGION:-<not set>}"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          CLAIMS=$(python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print("sub=%s | aud=%s | iss=%s" % (c["sub"], c["aud"], c["iss"]))' "$TOKEN")
          echo "::notice title=OIDC token claims::$CLAIMS"

  deploy-role:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in with the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity

      - name: Can reach the CDK deploy role (should PASS)
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          QUALIFIER=hnb659fds
          aws sts assume-role \
            --role-arn "arn:aws:iam::${ACCOUNT}:role/cdk-${QUALIFIER}-deploy-role-${ACCOUNT}-${AWS_REGION}" \
            --role-session-name access-check \
            --query 'AssumedRoleUser.Arn' --output text
          echo "PASS: deploy role can use the CDK bootstrap roles"

      - name: Cannot do anything else directly (should be DENIED)
        run: |
          if aws s3 ls >/dev/null 2>&1; then
            echo "FAIL: deploy role can list S3 directly; its policy is broader than intended"
            exit 1
          fi
          echo "PASS: direct S3 access denied, as intended"

  logs-role:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in with the read-only logs role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_LOGS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity

      - name: Can list the demo's log groups (should PASS; empty before the first deploy)
        run: |
          aws logs describe-log-groups \
            --log-group-name-prefix /aws/lambda/effect-demo- \
            --query 'logGroups[].logGroupName' --output text
          echo "PASS: logs role can read log groups"

      - name: Cannot write to DynamoDB (should be DENIED)
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if aws dynamodb create-table --table-name effect-demo-access-check \
               --attribute-definitions AttributeName=id,AttributeType=S \
               --key-schema AttributeName=id,KeyType=HASH \
               --billing-mode PAY_PER_REQUEST >/dev/null 2>&1; then
            echo "FAIL: logs role could create a table; deleting it and failing the check"
            aws dynamodb delete-table --table-name effect-demo-access-check >/dev/null 2>&1 || true
            exit 1
          fi
          echo "PASS: logs role cannot create tables, as intended"

  cdk-check:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in with the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Can use every CDK helper role (should PASS)
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          for R in deploy-role file-publishing-role image-publishing-role lookup-role; do
            aws sts assume-role --role-arn "arn:aws:iam::${ACCOUNT}:role/cdk-hnb659fds-${R}-${ACCOUNT}-${AWS_REGION}" \
              --role-session-name cdk-check --query 'AssumedRoleUser.Arn' --output text >/dev/null
            echo "::notice title=CDK helper role::${R} OK"
          done

      - name: Real CDK run against the account, creating nothing (should PASS)
        run: |
          mkdir -p /tmp/cdk-check && cd /tmp/cdk-check
          npm init -y >/dev/null
          npm install --silent aws-cdk-lib@2 constructs@10 aws-cdk@2 >/dev/null
          cat > app.js <<'JS'
          const cdk = require('aws-cdk-lib');
          const app = new cdk.App();
          const stack = new cdk.Stack(app, 'effect-demo-cdk-check', {
            env: { account: process.env.CDK_DEFAULT_ACCOUNT, region: process.env.CDK_DEFAULT_REGION },
          });
          new cdk.CfnOutput(stack, 'Check', { value: 'ok' });
          JS
          echo '{ "app": "node app.js" }' > cdk.json
          # diff assumes the lookup/deploy roles, reads the bootstrap version and compares
          # against CloudFormation, but deploys nothing.
          npx cdk diff --fail=false 2>&1 | tee diff.txt
          if grep -qi "requires bootstrap\|not been bootstrapped\|AccessDenied\|is not authorized" diff.txt; then
            echo "::error title=CDK::CDK could not use the bootstrap roles; see this step's log"
            exit 1
          fi
          echo "::notice title=CDK diff::CDK ran against the account using the bootstrap roles"
